# Colors come from wallust, regenerated by ~/.config/wallust/theme-apply.sh on
# every theme switch. theme-apply.sh then sends kitty a SIGUSR1 so running
# instances reload without a restart.
include ./colors/wallust.conf

font_family      JetBrainsMono Nerd Font
font_size        12.0

background_opacity 0.85
window_padding_width 12

# Receiving end of the universal SUPER+C / SUPER+V shortcuts
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

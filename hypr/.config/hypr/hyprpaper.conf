# Splash behavior (no-splash to disable splash text rendering)
splash = false

# Enable IPC for hyprctl communication
ipc = true

# Active wallpaper
wallpaper {
    monitor = eDP-1
    path = ~/.wallpapers/place.png
    fit_mode = cover
}

# Fallback for any other monitors
wallpaper {
    monitor = 
    path = ~/.wallpapers/place.png
    fit_mode = cover
}


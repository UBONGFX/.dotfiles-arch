# The Quickshell shell owns the lock screen (WlSessionLock + PAM). It is NOT a
# logind lock handler, so `loginctl lock-session` will not raise it -- call its
# IPC directly instead. hyprlock stays installed and is the fallback, so a shell
# that failed to start can never leave the session unlocked on idle.
general {
    lock_cmd = qs ipc call lock lock || (pidof hyprlock || hyprlock)
}

listener {
    timeout = 360
    on-timeout = qs ipc call lock lock || (pidof hyprlock || hyprlock)
}
